# /etc/nginx/sites-available/pawangtools
# Edit server_name, root (frontend/dist), dan proxy_pass sesuai domain Anda.

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pawang.example.com api.pawang.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pawang.example.com api.pawang.example.com;

    # SSL akan di-inject oleh certbot --nginx. Jangan edit blok ssl_certificate.

    # Security headers (tambahan di luar helmet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Frontend static files
    root /opt/pawangtools/frontend/dist;
    index index.html;

    # Batas upload (untuk tool releases via UI)
    client_max_body_size 600M;

    # API: proxy ke backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA: semua route yang tidak dimulai dengan /api di-serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Jangan cache index.html
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
